[project]
name = "anki-cards"
version = "0.1.0"
description = "Anki card sources in YAML, plus scripts that build them into .apkg decks"
requires-python = ">=3.11"
dependencies = [
    "genanki>=0.13.1",
    "pyyaml>=6.0",
]

[dependency-groups]
# Only needed to render a scanned PDF in raw_input/ into readable page images.
extract = ["pymupdf>=1.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ankicards"]
