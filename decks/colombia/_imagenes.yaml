# Imágenes de referencia del mazo Colombia.
#
# Los bytes viven en .image-cache/ (ignorado por git); esto es lo que se versiona,
# porque lo caro no son los archivos sino haber encontrado la imagen correcta y
# haberla mirado una por una.
#
#   origen: guia-oficial  -> foto de la guía oficial de la Cancillería
#   origen: grok          -> ilustración generada, solo para conceptos abstractos
#
# NUNCA se genera un símbolo patrio, un mapa, un billete ni un rostro real: a
# Grok se le pidió el escudo nacional de prueba y devolvió uno con cuatro
# cuarteles, un capibara y caña de azúcar.
