  # ─── 1.8 Región Orinoquía ────────────────────────────────────────────
  - id: geo-orinoquia-extension
    front: ¿Qué porcentaje del territorio colombiano ocupa la región Orinoquía?
    back: El 28 % del territorio; se extiende por una vasta llanura.
    notes: 'Fuente: Módulo 2, p. 10 (§5.1)'
    tags: [orinoquia]

  - id: geo-orinoquia-limites
    model: cloze
    text: 'La Orinoquía limita al norte con {{c1::Venezuela}}, al este con {{c2::Brasil}}, al sur con la {{c3::Amazonia}} y al oeste con la {{c4::región Andina}}.'
    notes: 'Fuente: Módulo 2, p. 10 (§5.1)'
    tags: [orinoquia]

  - id: geo-orinoquia-rios
    front: ¿Cuáles son los 2 ríos importantes de la región Orinoquía?
    back: El Meta y el Orinoco.
    notes: 'Fuente: Módulo 2, p. 10 (§5.2)'
    tags: [orinoquia]

  - id: geo-orinoquia-relieve
    front: ¿Cómo es el relieve de la región Orinoquía?
    back: Tierras planas o llano con muchas llanuras y sabanas, llamadas Llanos Orientales, cubiertas por pasto y vegetación de sabana.
    notes: 'Fuente: Módulo 2, p. 10 (§5.3)'
    tags: [orinoquia]

  - id: geo-orinoquia-serranias
    front: ¿Qué serranías se encuentran en la región Orinoquía?
    back: La serranía de La Macarena y la serranía de La Lindosa.
    notes: 'Fuente: Módulo 2, p. 10 (§5.3)'
    tags: [orinoquia]

  - id: geo-capibara
    front: ¿Cuál es el roedor más grande del mundo, habitante de la Orinoquía?
    back: El capibara.
    notes: 'La cartilla lo escribe "capibora". Fuente: Módulo 2, p. 10 (§5.4)'
    tags: [orinoquia]

  - id: geo-delfin-rio
    front: ¿En qué ríos se ubica el delfín de río?
    back: En los ríos Orinoco y Meta.
    notes: 'Fuente: Módulo 2, p. 10 (§5.4)'
    tags: [orinoquia]

  - id: geo-orinoquia-fauna
    model: cloze
    text: 'Fauna de la Orinoquía: el {{c1::capibara}}, el {{c2::delfín de río}}, el {{c3::venado cola blanca}}, el {{c4::oso hormiguero}} y los {{c5::jaguares}}.'
    notes: 'Fuente: Módulo 2, p. 10 (§5.4)'
    tags: [orinoquia]

  - id: geo-orinoquia-aves-reptiles
    model: cloze
    text: 'En la Orinoquía se encuentran el {{c1::águila arpía}}, la {{c2::guacamaya roja}}, la {{c3::garza real}}, el {{c4::caimán del Orinoco}}, la {{c5::rana venenosa}} y la {{c6::tortuga charapa}}.'
    notes: 'Fuente: Módulo 2, p. 10 (§5.4)'
    tags: [orinoquia]

  - id: geo-cano-cristales
    model: basic-reversed
    front: Caño Cristales
    back: Río de la serranía de La Macarena (Orinoquía); su belleza son sus varios colores, por sus algas coloradas
    notes: 'Anotación manuscrita del margen (p. 10), marcada "ojo". Fuente: Módulo 2, p. 10'
    tags: [orinoquia, anotacion]

  - id: geo-orinoquia-poblacion
    front: ¿Por quiénes está conformada la población de la región Orinoquía?
    back: Por comunidades indígenas y afrodescendientes; indígenas Sikuani, Guahibo y Curripaco.
    notes: 'Fuente: Módulo 2, p. 11 (§5.5)'
    tags: [orinoquia, demografia]

  - id: geo-orinoquia-deptos
    model: cloze
    text: 'Departamentos de la región Orinoquía: {{c1::Arauca}}, {{c2::Casanare}}, {{c3::Meta}} y {{c4::Vichada}}.'
    notes: 'Fuente: Módulo 2, p. 11 (§5.6)'
    tags: [orinoquia]

  - id: geo-cap-arauca
    model: basic-reversed
    front: Arauca (departamento)
    back: Arauca (capital)
    notes: 'Departamento y capital, región Orinoquía. Fuente: Módulo 2, p. 11'
    tags: [orinoquia]

  - id: geo-cap-casanare
    model: basic-reversed
    front: Casanare
    back: Yopal
    notes: 'Departamento y capital, región Orinoquía. Fuente: Módulo 2, p. 11'
    tags: [orinoquia]

  - id: geo-cap-meta
    model: basic-reversed
    front: Meta
    back: Villavicencio
    notes: 'Departamento y capital, región Orinoquía. Fuente: Módulo 2, p. 11'
    tags: [orinoquia]

  - id: geo-cap-vichada
    model: basic-reversed
    front: Vichada
    back: Puerto Carreño
    notes: 'Departamento y capital, región Orinoquía. Fuente: Módulo 2, p. 11'
    tags: [orinoquia]

  - id: geo-orinoquia-economia
    model: cloze
    text: 'La economía de la Orinoquía se basa en actividades {{c1::agropecuarias}}, {{c2::ganadería}}, extracción de {{c3::petróleo}}, {{c4::minería}} y {{c5::turismo}}.'
    notes: 'Fuente: Módulo 2, p. 11 (§5.7)'
    tags: [orinoquia]

  # ─── Datos demográficos (anotación manuscrita, p. 11) ────────────────
  - id: geo-grupos-etnicos-cinco
    model: cloze
    text: 'Los grupos étnicos de Colombia son: {{c1::indígenas}}, {{c2::raizales}}, {{c3::afrocolombianos}}, {{c4::palenqueros}} y {{c5::Rom o gitanos}}.'
    notes: 'Anotación manuscrita de los márgenes (p. 11), "Datos demográficos básicos". Fuente: Módulo 2, p. 11'
    tags: [demografia, anotacion]

  - id: geo-poblacion-total
    front: Según la anotación de la cartilla, ¿cuál es la población de Colombia?
    back: Aproximadamente 44 millones de personas.
    notes: 'La anotación decía "44-50 millones"; la guía oficial fija ~44 millones. Fuente: Guía oficial "Colombia, nuestra casa" (Cancillería), p. 87 (§1.3)'
    tags: [demografia, anotacion]

  - id: geo-indigenas-pct
    front: Según la anotación de la cartilla, ¿qué porcentaje de la población son indígenas?
    back: Alrededor del 4,3 %, más de 1,8 millones de personas.
    notes: 'Confirmado. Los grupos más numerosos son los Wayuu, Nasa, Arhuacos y Páez. Fuente: Guía oficial "Colombia, nuestra casa" (Cancillería), p. 87 (§1.3)'
    tags: [demografia, anotacion]

  - id: geo-raizales-definicion
    model: basic-reversed
    front: Raizales
    back: Habitantes originarios de San Andrés, Providencia y Santa Catalina; 0,06 % de la población, unas 25.300 personas (censo 2018)
    notes: 'Cifras de la fuente oficial. Fuente: Guía oficial "Colombia, nuestra casa" (Cancillería), p. 87 (§1.3)'
    tags: [demografia, anotacion]

  - id: geo-afrocolombianos-pct
    front: Según la anotación de la cartilla, ¿qué porcentaje de la población son afrocolombianos?
    back: Aproximadamente el 6,7 %, más de 3 millones de personas.
    notes: 'Confirmado. Se concentran en el Pacífico, la costa Caribe y algunas zonas urbanas. Fuente: Guía oficial "Colombia, nuestra casa" (Cancillería), p. 87 (§1.3)'
    tags: [demografia, anotacion]

  - id: geo-palenqueros-definicion
    model: basic-reversed
    front: Palenqueros
    back: Descendientes de esclavos africanos liberados en el siglo XVII en San Basilio de Palenque (Bolívar); unas 6.650 personas
    notes: 'Cifras de la fuente oficial. Fuente: Guía oficial "Colombia, nuestra casa" (Cancillería), p. 87 (§1.3)'
    tags: [demografia, anotacion]

  - id: geo-rom-gitanos
    model: basic-reversed
    front: Rom o gitanos
    back: Grupo étnico gitano; 2.606 personas se autorreconocieron como Rom en el último censo
    notes: 'La anotación decía "≈2.000"; la cifra oficial es 2.606, con una reducción del 45,5 % frente al Censo 2005. Fuente: Guía oficial "Colombia, nuestra casa" (Cancillería), p. 87 (§1.3)'
    tags: [demografia, anotacion]

  # ─── 2. Geografía física ─────────────────────────────────────────────
  - id: geo-cordillera-occidental
    front: ¿Dónde se ubica la cordillera Occidental?
    back: Cerca al océano Pacífico.
    notes: 'Fuente: Módulo 2, p. 11 (§2.1)'
    tags: [geografia-fisica]

  - id: geo-cordillera-central
    front: ¿Dónde se ubica la cordillera Central y qué volcán contiene?
    back: En el centro del país; contiene el volcán del Nevado del Huila.
    notes: 'La anotación manuscrita añade el Nevado del Ruiz. Fuente: Módulo 2, p. 11 (§2.1)'
    tags: [geografia-fisica]

  - id: geo-cordillera-oriental
    front: ¿Dónde se ubica la cordillera Oriental y hasta dónde llega?
    back: Al este del país; va hasta el territorio venezolano.
    notes: 'Fuente: Módulo 2, p. 11 (§2.1)'
    tags: [geografia-fisica]

  - id: geo-sierra-nevada-altura
    front: ¿Dónde está la Sierra Nevada de Santa Marta y qué altura alcanza?
    back: Al norte del país, región Caribe, a una altura de 5.700 metros; allí está el pico Cristóbal Colón.
    notes: 'Fuente: Módulo 2, p. 11 (§2.2)'
    tags: [geografia-fisica]

  - id: geo-pico-cristobal-colon
    model: basic-reversed
    front: Pico Cristóbal Colón
    back: Pico de la Sierra Nevada de Santa Marta, a 5.700 m
    notes: 'Fuente: Módulo 2, p. 11 (§2.2)'
    tags: [geografia-fisica]

  - id: geo-serrania-baudo
    front: ¿Dónde está situada la serranía del Baudó?
    back: En la costa del Pacífico, departamento del Chocó.
    notes: 'Fuente: Módulo 2, p. 11 (§2.2)'
    tags: [geografia-fisica]

  - id: geo-macizo-colombiano
    front: ¿Dónde está el Macizo Colombiano y de qué se compone?
    back: Al suroeste de Colombia; se compone de las tres cordilleras (Occidental, Central y Oriental) y alberga los nevados del Huila y el Nevado del Cumbal.
    notes: 'El resumen escrito a mano dice "sureste"; la guía oficial dice suroeste (p. 90). Corregido. Fuente: Guía oficial "Colombia, nuestra casa" (Cancillería), p. 90'
    tags: [geografia-fisica, corregido]

  - id: geo-valles-interandinos
    model: cloze
    text: 'Los valles interandinos son: el valle del {{c1::Cauca}}, el valle de {{c2::Aburrá}}, el valle del {{c3::Magdalena}} y el valle del {{c4::Patía}}.'
    notes: 'Anotación manuscrita (p. 11, §2.3); la cartilla impresa solo remite a la pág. 91. Fuente: Módulo 2, p. 11'
    tags: [geografia-fisica, anotacion]

  - id: geo-llanuras-tres
    model: cloze
    text: 'Las llanuras de Colombia son: la llanura del {{c1::Caribe}}, la llanura del {{c2::Amazonas}} y las llanuras {{c3::Orientales}}.'
    notes: 'Anotación manuscrita (p. 11, §2.4); la cartilla impresa solo remite a la pág. 92. Fuente: Módulo 2, p. 11'
    tags: [geografia-fisica, anotacion]

  # ─── 2.5 Territorio insular ──────────────────────────────────────────
  - id: geo-territorio-insular
    front: ¿De qué se compone el territorio insular de Colombia?
    back: De varias islas ubicadas en el océano Atlántico y el mar Caribe.
    notes: 'Fuente: Módulo 2, p. 11 (§2.5)'
    tags: [insular]

  - id: geo-archipielago-islas
    model: cloze
    text: 'El archipiélago lo componen {{c1::San Andrés}}, {{c2::Providencia}}, {{c3::Santa Catalina}}, {{c4::Quitasueño}}, {{c5::Serrana}}, {{c6::Serranilla}}, {{c7::Bajo Nuevo}}, {{c8::Roncador}}, {{c9::Albuquerque}} y {{c10::Este-Sudeste}}.'
    notes: 'Son 10, como dice la cartilla; el resumen solo alcanzó a copiar 8 (faltaban Serranilla y Este-Sudeste). Es el único departamento sin territorio continental. Fuente: Guía oficial "Colombia, nuestra casa" (Cancillería), p. 93'
    tags: [insular, corregido]

  - id: geo-islas-rosario
    model: basic-reversed
    front: Islas del Rosario
    back: Islas del mar Caribe, cerca a Cartagena
    notes: 'Fuente: Módulo 2, p. 11 (§2.5)'
    tags: [insular]

  - id: geo-isla-gorgona
    model: basic-reversed
    front: Isla Gorgona
    back: Isla del océano Pacífico; parque nacional natural declarado patrimonio de la humanidad
    notes: 'Fuente: Módulo 2, p. 11 (§2.5)'
    tags: [insular]

  - id: geo-isla-malpelo
    front: ¿Dónde se ubica la isla Malpelo?
    back: En el océano Pacífico, al suroeste de Colombia; es una isla volcánica y reserva de fauna marina.
    notes: 'El resumen escrito a mano dice "sureste"; la guía oficial dice suroeste (p. 94). Corregido. Fuente: Guía oficial "Colombia, nuestra casa" (Cancillería), p. 94'
    tags: [insular, corregido]

  # ─── 3. El clima ─────────────────────────────────────────────────────
  - id: geo-clima-ecuatorial
    model: basic-reversed
    front: Clima ecuatorial
    back: Comprende las regiones costeras del Caribe y del Pacífico
    notes: 'Fuente: Módulo 2, p. 12 (§3)'
    tags: [clima]

  - id: geo-clima-subecuatorial
    model: basic-reversed
    front: Clima subecuatorial
    back: Comprende los valles interandinos, que varían según la altitud
    notes: 'Fuente: Módulo 2, p. 12 (§3)'
    tags: [clima]

  - id: geo-clima-templado
    model: basic-reversed
    front: Clima templado
    back: Comprende las regiones montañosas del centro del país
    notes: 'Fuente: Módulo 2, p. 12 (§3)'
    tags: [clima]

  - id: geo-clima-alta-montana
    model: basic-reversed
    front: Clima de alta montaña
    back: Comprende las cumbres más altas de las cordilleras
    notes: 'Fuente: Módulo 2, p. 12 (§3)'
    tags: [clima]

  - id: geo-climas-cuatro
    model: cloze
    text: 'Los climas de Colombia son: {{c1::ecuatorial}}, {{c2::subecuatorial}}, {{c3::templado}} y de {{c4::alta montaña}}.'
    notes: 'Fuente: Módulo 2, p. 12 (§3)'
    tags: [clima]

  # ─── 3.1 Pisos térmicos ──────────────────────────────────────────────
  - id: geo-pisos-termicos-cuatro
    model: cloze
    text: 'Los pisos térmicos son: tierras {{c1::calientes}}, tierra {{c2::templada}}, tierras {{c3::frías}} y tierras {{c4::heladas o páramos}}.'
    notes: 'Fuente: Módulo 2, p. 12 (§3.1)'
    tags: [pisos-termicos]

  - id: geo-tierra-caliente-altitud
    front: ¿Qué altitud y temperatura tienen las tierras calientes?
    back: Altitud inferior a 1.000 m sobre el nivel del mar; temperaturas de 24 a 28 °C.
    notes: 'Fuente: Módulo 2, p. 12 (§3.1)'
    tags: [pisos-termicos]

  - id: geo-tierra-templada-altitud
    front: ¿Qué altitud y temperatura tiene la tierra templada?
    back: Altitud entre 1.000 y 2.000 m sobre el nivel del mar; temperaturas entre 18 y 24 °C.
    notes: 'Fuente: Módulo 2, p. 12 (§3.1)'
    tags: [pisos-termicos]

  - id: geo-tierra-fria-altitud
    front: ¿Qué altitud y temperatura tienen las tierras frías?
    back: Altitud entre 2.000 y 3.000 m sobre el nivel del mar; temperaturas entre 10 y 18 °C.
    notes: 'Fuente: Módulo 2, p. 12 (§3.1)'
    tags: [pisos-termicos]

  - id: geo-paramo-altitud
    front: ¿Qué altitud y temperatura tienen las tierras heladas o páramos?
    back: Altitud superior a los 3.000 m sobre el nivel del mar; temperaturas por debajo de 10 °C.
    notes: 'Fuente: Módulo 2, p. 12 (§3.1)'
    tags: [pisos-termicos]

  # ─── 3.2 Recursos naturales ──────────────────────────────────────────
  - id: geo-recursos-minerales
    model: cloze
    text: 'Recursos minerales de Colombia: {{c1::carbón}}, {{c2::petróleo}}, {{c3::oro}}, {{c4::níquel}} y {{c5::esmeraldas}}.'
    notes: 'Fuente: Módulo 2, p. 12 (§3.2)'
    tags: [recursos]

  - id: geo-recursos-hidricos
    front: ¿Cuáles son los recursos hídricos de Colombia?
    back: Los ríos Magdalena y Cauca, lagos y embalses, como el embalse de Guatapé en Antioquia.
    notes: 'Fuente: Módulo 2, p. 12 (§3.2)'
    tags: [recursos]

  - id: geo-recursos-energeticos
    model: cloze
    text: 'Recursos energéticos de Colombia: {{c1::hidroeléctrica}}, {{c2::térmica}}, {{c3::solar}} y {{c4::eólica}}.'
    notes: 'Fuente: Módulo 2, p. 12 (§3.2)'
    tags: [recursos]

  - id: geo-embalse-guatape
    model: basic-reversed
    front: Embalse de Guatapé
    back: Principal embalse de Colombia, en Antioquia
    notes: 'Fuente: Módulo 2, p. 12 (§3.2)'
    tags: [recursos]

  # ─── 4. Geografía humana ─────────────────────────────────────────────
  - id: geo-grupos-etnicos-humana
    model: cloze
    text: 'Grupos étnicos de Colombia: indígenas {{c1::Wayuu}}, {{c2::Emberá}}, {{c3::Kogui}}, {{c4::Arhuacos}} y {{c5::mestizos}}.'
    notes: 'La cartilla escribe "Guayu". Fuente: Módulo 2, p. 12 (§4.1)'
    tags: [geografia-humana, demografia]

  - id: geo-centros-urbanos
    model: cloze
    text: 'Los centros urbanos de Colombia son: {{c1::Bogotá}} (capital del país), {{c2::Medellín}}, {{c3::Cali}}, {{c4::Barranquilla}} y {{c5::Bucaramanga}}.'
    notes: 'La lista numerada y Bucaramanga vienen de la anotación manuscrita (p. 12). Fuente: Módulo 2, p. 12 (§4.2)'
    tags: [geografia-humana, anotacion]

  - id: geo-zonas-rurales
    front: ¿Qué son las zonas rurales?
    back: Zonas de baja densidad de población con actividades agrícolas y ganaderas.
    notes: 'Fuente: Módulo 2, p. 12 (§4.3)'
    tags: [geografia-humana]

  - id: geo-economia-rural
    model: cloze
    text: 'La economía rural se basa en la {{c1::agricultura}}, la {{c2::ganadería}}, el cultivo de {{c3::café}}, {{c4::papa}} y {{c5::plátano}}, y el {{c6::petróleo}}.'
    notes: 'El petróleo viene de la anotación manuscrita (p. 12). Fuente: Módulo 2, p. 12 (§4.3)'
    tags: [geografia-humana, anotacion]

  - id: geo-cultura-rural
    front: ¿Cómo es la cultura de las zonas rurales de Colombia?
    back: Campesina, indígena y afrocolombiana.
    notes: 'Fuente: Módulo 2, p. 12 (§4.3)'
    tags: [geografia-humana]

  # ═══════════════════════════════════════════════════════════════════
  # AMPLIACIÓN desde la guía oficial "Colombia, nuestra casa" (pp. 63-94).
  # Este módulo exige 11/20 (55 %). Son sobre todo las tablas-resumen por
  # región, que el resumen escaneado no alcanzó a copiar y que tienen
  # forma de pregunta de examen. Etiqueta `ampliacion`.
  # ═══════════════════════════════════════════════════════════════════

  - id: geo-extension-andina
    front: ¿Cuál es la extensión aproximada de la región Andina?
    back: 800.000 km².
    notes: 'Fuente: Guía oficial, p. 69'
    tags: [andina, ampliacion]

  - id: geo-extension-caribe
    front: ¿Cuántos kilómetros de costa tiene la región Caribe?
    back: 1.600 km de costa.
    notes: 'Fuente: Guía oficial, p. 75'
    tags: [caribe, ampliacion]

  - id: geo-extension-pacifica
    front: ¿Cuál es la extensión aproximada de la región Pacífica?
    back: 1.300 km.
    notes: 'Fuente: Guía oficial, p. 81'
    tags: [pacifica, ampliacion]

  - id: geo-extensiones-comparadas
    model: cloze
    text: 'Extensiones por región: Andina {{c1::800.000}} km², Amazónica {{c2::403.000}} km², Caribe {{c3::1.600}} km de costa, Pacífica {{c4::1.300}} km, Orinoquía el {{c5::28}} % del territorio.'
    notes: 'Fuente: Guía oficial, pp. 63, 69, 75, 81 y 86'
    tags: [regiones, ampliacion]

  - id: geo-amazonica-clima
    front: ¿Qué clima y vegetación tiene la región Amazónica?
    back: Selva ecuatorial, con clima ecuatorial húmedo, altas temperaturas y alta humedad todo el año.
    notes: 'Fuente: Guía oficial, p. 63'
    tags: [amazonica, clima, ampliacion]

  - id: geo-andina-clima
    front: ¿Cómo es el clima de la región Andina?
    back: Variado, porque cambia con la altitud de las cordilleras.
    notes: 'Fuente: Guía oficial, p. 69'
    tags: [andina, clima, ampliacion]

  - id: geo-pacifica-clima
    front: ¿Qué vegetación caracteriza a la región Pacífica?
    back: Selva ecuatorial húmeda; es una de las zonas más lluviosas del mundo.
    notes: 'Fuente: Guía oficial, pp. 81 y 90'
    tags: [pacifica, clima, ampliacion]

  - id: geo-pacifica-relieve-oficial
    model: cloze
    text: 'El relieve de la región Pacífica incluye {{c1::llanuras y valles fluviales}}, {{c2::estuarios}}, {{c3::manglares}} y {{c4::playas}}, limitado por la cordillera Occidental.'
    notes: 'Fuente: Guía oficial, p. 81'
    tags: [pacifica, ampliacion]

  - id: geo-pacifica-rios-oficial
    front: Según la tabla-resumen oficial, ¿cuáles son los ríos principales de la región Pacífica?
    back: El San Juan y el Atrato.
    notes: 'El resumen escaneado añade Baudó, Mira y Patía. Fuente: Guía oficial, p. 81'
    tags: [pacifica, ampliacion]

  - id: geo-andina-rios-oficial
    front: Según la tabla-resumen oficial, ¿cuáles son los ríos principales de la región Andina?
    back: El Magdalena y el Cauca.
    notes: 'Fuente: Guía oficial, p. 69'
    tags: [andina, ampliacion]

  - id: geo-orinoquia-relieve-oficial
    model: cloze
    text: 'El relieve de la Orinoquía lo forman {{c1::mesetas y colinas}} y {{c2::llanuras}}, conocidas como los {{c3::Llanos Orientales}}.'
    notes: 'Fuente: Guía oficial, p. 86'
    tags: [orinoquia, ampliacion]

  - id: geo-caribe-relieve-oficial
    model: cloze
    text: 'El relieve de la región Caribe lo forman {{c1::llanuras costeras}}, la {{c2::Sierra Nevada de Santa Marta}}, la {{c3::Serranía de Perijá}} y los {{c4::Montes de María}}.'
    notes: 'Fuente: Guía oficial, p. 75'
    tags: [caribe, ampliacion]

  - id: geo-choco-lluvias
    front: ¿Qué distingue al Chocó en términos de clima a nivel mundial?
    back: Es una de las zonas más lluviosas del mundo, con gran cantidad de especies endémicas y en peligro de extinción.
    notes: 'Fuente: Guía oficial, p. 90'
    tags: [pacifica, clima, ampliacion]

  - id: geo-gorgona-ubicacion-oficial
    front: ¿A qué distancia de la costa está la isla Gorgona y a qué departamento pertenece?
    back: A 28 km al oeste de la costa Pacífica; pertenece al municipio de Guapi, departamento del Cauca.
    notes: 'Fuente: https://es.wikipedia.org/wiki/Isla_Gorgona'
    tags: [insular, ampliacion, externo]

  - id: geo-malpelo-departamento
    front: ¿A qué departamento pertenece la isla Malpelo?
    back: Al Valle del Cauca, bajo la jurisdicción especial de Buenaventura.
    notes: 'Fuente: https://es.wikipedia.org/wiki/Isla_de_Malpelo'
    tags: [insular, ampliacion, externo]

  - id: geo-malpelo-tiburones
    front: ¿Por qué es mundialmente importante la isla Malpelo?
    back: Es uno de los lugares más importantes del mundo para la observación de tiburones; es una isla volcánica y reserva de fauna marina.
    notes: 'Fuente: Guía oficial, p. 94'
    tags: [insular, ampliacion]

  - id: geo-archipielago-sin-continente
    front: ¿Qué tiene de único el departamento de San Andrés, Providencia y Santa Catalina?
    back: Es el único departamento de Colombia sin territorio continental.
    notes: 'Fuente: Guía oficial, p. 93'
    tags: [insular, ampliacion]

  - id: geo-indigenas-mas-numerosos
    model: cloze
    text: 'Los grupos indígenas más numerosos de Colombia son los {{c1::Wayuu}}, los {{c2::Nasa}}, los {{c3::Arhuacos}} y los {{c4::Páez}}.'
    notes: 'Se distribuyen sobre todo en la Sierra Nevada de Santa Marta, la Amazonía y la región Andina. Fuente: Guía oficial, p. 87 (§1.3)'
    tags: [demografia, ampliacion]

  - id: geo-palenqueros-origen
    front: ¿De dónde provienen los palenqueros y en qué siglo?
    back: De esclavos africanos liberados en el siglo XVII en San Basilio de Palenque, departamento de Bolívar.
    notes: 'Fuente: Guía oficial, p. 87 (§1.3)'
    tags: [demografia, ampliacion]

  - id: geo-afrocolombianos-donde
    front: ¿Dónde se concentra la población afrocolombiana?
    back: En la región del Pacífico, la costa Caribe y algunas zonas urbanas; su origen es la llegada de esclavos africanos durante la Colonia.
    notes: 'Fuente: Guía oficial, p. 87 (§1.3)'
    tags: [demografia, ampliacion]

  - id: geo-grupos-etnicos-cifras
    model: cloze
    text: 'Cifras étnicas: indígenas {{c1::4,3}} %, afrocolombianos {{c2::6,7}} %, raizales {{c3::0,06}} %, palenqueros unas {{c4::6.650}} personas y Rom {{c5::2.606}} personas.'
    notes: 'Población total del país: aproximadamente 44 millones. Fuente: Guía oficial, p. 87 (§1.3)'
    tags: [demografia, ampliacion]

  - id: geo-macizo-importancia
    front: ¿Por qué es importante el Macizo Colombiano?
    back: Por la regulación del clima, el suministro de agua y la protección de la biodiversidad; allí nacen las tres cordilleras.
    notes: 'Fuente: Guía oficial, p. 90'
    tags: [geografia-fisica, ampliacion]
