  # ─── 1.6 Región Caribe ───────────────────────────────────────────────
  - id: geo-caribe-ubicacion
    front: ¿Dónde se ubica la región Caribe y de dónde viene su nombre?
    back: En la costa norte del país; su nombre se debe a que limita con el mar Caribe.
    notes: 'Fuente: Módulo 2, p. 9 (§1.6)'
    tags: [caribe]

  - id: geo-caribe-extension
    front: ¿Desde dónde hasta dónde se extiende la región Caribe?
    back: Desde el golfo de Urabá hasta el golfo de Venezuela.
    notes: 'Fuente: Módulo 2, p. 9 (§3.1)'
    tags: [caribe]

  - id: geo-caribe-compuesta
    front: ¿Por qué está compuesto el aspecto geográfico de la región Caribe?
    back: Por llanura costera, deltas, ríos y la cadena montañosa de la Sierra Nevada de Santa Marta.
    notes: 'Fuente: Módulo 2, p. 9 (§3.1)'
    tags: [caribe]

  - id: geo-caribe-rios
    model: cloze
    text: 'Ríos de la región Caribe: {{c1::Magdalena}}, {{c2::Cauca}}, {{c3::Sinú}}, {{c4::San Jorge}} y {{c5::Ranchería}}.'
