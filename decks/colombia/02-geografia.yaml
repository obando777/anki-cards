    model: cloze
    text: 'El relieve de la región Caribe lo forman {{c1::llanuras costeras}}, la {{c2::Sierra Nevada de Santa Marta}}, la {{c3::Sierra de Perijá}} y los {{c4::Montes de María}}.'
