  # ─── 1. Ubicación geográfica y fronteras ─────────────────────────────
  - id: geo-ubicacion
    front: ¿Dónde se ubica Colombia?
    back: En la parte noroccidente de América del Sur.
    notes: 'Fuente: Módulo 2, p. 8 (§1)'
    tags: [ubicacion]

  - id: geo-fronteras
    model: cloze
    text: 'Colombia limita al norte con el {{c1::mar Caribe}}, al oriente con {{c2::Venezuela y Brasil}}, al sur con {{c3::Perú y Ecuador}} y al occidente con {{c4::Panamá y el océano Pacífico}}.'
    notes: 'Fuente: Módulo 2, p. 8 (§1)'
    tags: [ubicacion]

  - id: geo-frontera-norte
    front: ¿Con qué limita Colombia al norte?
    back: Con el mar Caribe.
    notes: 'Fuente: Módulo 2, p. 8 (§1)'
    tags: [ubicacion]

  - id: geo-frontera-oriente
    front: ¿Con qué países limita Colombia al oriente?
    back: Con Venezuela y Brasil.
    notes: 'Fuente: Módulo 2, p. 8 (§1)'
    tags: [ubicacion]

  - id: geo-frontera-sur
    front: ¿Con qué países limita Colombia al sur?
    back: Con Perú y Ecuador.
    notes: 'Fuente: Módulo 2, p. 8 (§1)'
    tags: [ubicacion]

  - id: geo-frontera-occidente
    front: ¿Con qué limita Colombia al occidente?
    back: Con Panamá y el océano Pacífico.
    notes: 'Fuente: Módulo 2, p. 8 (§1)'
    tags: [ubicacion]

  - id: geo-cordilleras-nombre
    model: cloze
    text: 'La cordillera de los Andes se divide en Colombia en 3 cordilleras: {{c1::Occidental}}, {{c2::Central}} y {{c3::Oriental}}.'
    notes: 'Fuente: Módulo 2, p. 8 (§1)'
    tags: [ubicacion]

  - id: geo-llanuras-cuenta
    front: Además de las cordilleras, ¿con qué llanuras cuenta Colombia?
    back: Con los Llanos Orientales y la región Amazónica.
    notes: 'Fuente: Módulo 2, p. 8 (§1)'
    tags: [ubicacion]

  # ─── 1.2 Regiones biogeográficas ─────────────────────────────────────
  - id: geo-regiones-cuantas
    front: ¿Cuántas regiones biogeográficas tiene Colombia y cuáles son?
    back: 5 regiones - Caribe, Andina, Pacífica, Orinoquía y Amazónica. <br><img src="mapa-regiones-naturales.png">
    notes: 'Fuente: Módulo 2, p. 8 (§1.2)'
    tags: [regiones]

  - id: geo-regiones-cloze
    model: cloze
    text: 'Las 5 regiones biogeográficas son: región {{c1::Caribe}}, región {{c2::Andina}}, región {{c3::Pacífica}}, región {{c4::Orinoquía}} y región {{c5::Amazónica}}.'
    notes: 'Fuente: Módulo 2, p. 8 (§1.2)'
    tags: [regiones]

  - id: geo-regiones-diferencian
    front: ¿Por qué se diferencian entre sí las regiones biogeográficas?
    back: Por sus climas, relieve, biodiversidad y forma de vida de quienes las habitan.
    notes: 'Fuente: Módulo 2, p. 8 (§1.2)'
    tags: [regiones]

  # ─── 1.3 Región Amazónica ────────────────────────────────────────────
  - id: geo-amazonica-rios
    front: ¿Cuáles son los principales ríos de la región Amazónica?
