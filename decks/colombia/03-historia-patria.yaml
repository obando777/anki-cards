  - id: his-m19-creacion
    front: ¿Qué hecho originó la creación del M-19 y en qué año?
    back: Rojas Pinilla ganó las elecciones, pero el gobierno de Carlos Lleras Restrepo dio la victoria a Misael Pastrana Borrero, candidato conservador; esto originó la creación del M-19 en 1974.
    notes: 'Fuente: Módulo 3, p. 16 (§6.2)'
    tags: [violencia]

