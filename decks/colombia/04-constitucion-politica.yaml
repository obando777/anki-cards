# Colombia::4. Constitución Política
#
# Fuente: cartilla escaneada, Módulo 4 "Constitución Política de Colombia",
# páginas 17-19. Metadatos del examen anotados al margen: Tiempo 35',
# 34 preguntas, mínimo 12/20. La C.P.C. tiene 380 artículos.
#
# deck_id y los `id` de las tarjetas son permanentes. Ver el encabezado de
# 01-cultura-y-sociedad.yaml para la leyenda de etiquetas de control.

deck: Colombia::4. Constitución Política
deck_id: 1148369932
model: basic
tags: [colombia, modulo-4]

cards:

  # ─── Cap. I Principios, derechos y garantías ─────────────────────────
  - id: con-articulos-total
    front: ¿Cuántos artículos tiene la Constitución Política de Colombia?
    back: 380 artículos.
    notes: 'Anotación manuscrita del encabezado (p. 17). Fuente: Módulo 4, p. 17'
    tags: [principios, anotacion]

  - id: con-articulo-1
    front: ¿Qué consagra el artículo 1 de la Constitución?
    back: "COLOMBIA ESTADO SOCIAL DE DERECHO."
    notes: 'Fuente: Módulo 4, p. 17 (§1)'
    tags: [principios]

  - id: con-articulo-3
    front: ¿Qué consagra el artículo 3 de la Constitución?
    back: "LA SOBERANÍA RESIDE EXCLUSIVAMENTE EN EL PUEBLO."
    notes: 'Fuente: Módulo 4, p. 17 (§1)'
    tags: [principios]

  - id: con-estado-social-derecho
    front: ¿Qué garantiza el principio del Estado Social de Derecho?
    back: Que el Estado protege los derechos humanos y castiga la violación al derecho internacional humanitario.
    notes: 'La anotación manuscrita lo sitúa del artículo 1 al 10. Fuente: Módulo 4, p. 17 (§1.1)'
    tags: [principios, anotacion]

  - id: con-descentralizacion
    model: basic-reversed
    front: Descentralización
    back: Principio que distribuye las funciones administrativas y públicas entre la administración central y sus territorios
    notes: 'Fuente: Módulo 4, p. 17 (§1.2)'
    tags: [principios]

  - id: con-soberania-popular
    model: basic-reversed
    front: Soberanía popular
    back: La autoridad en Colombia reside en el pueblo, expresada a través del voto (art. 3)
    notes: 'El artículo lo añade la anotación manuscrita. Fuente: Módulo 4, p. 17 (§1.3)'
    tags: [principios, anotacion]

  - id: con-supremacia-cpc
    model: basic-reversed
    front: Supremacía de la C.P.C.
    back: La Constitución Política de Colombia es norma de normas o norma suprema (art. 4)
    notes: 'El artículo lo añade la anotación manuscrita. Fuente: Módulo 4, p. 17 (§1.4)'
    tags: [principios, anotacion]

  # ─── 1.5 Derechos fundamentales ──────────────────────────────────────
  - id: con-derechos-fundamentales-rango
    front: ¿En qué artículos están consagrados los derechos fundamentales?
    back: Desde el artículo 11 al 44.
    notes: 'Protegen a toda persona desde el mismo momento de su existencia. Fuente: Módulo 4, p. 17 (§1.5)'
    tags: [derechos-fundamentales]

  - id: con-art-11
    model: basic-reversed
    front: Artículo 11
    back: Derecho a la vida
    notes: 'Fuente: Módulo 4, p. 17 (§1.6)'
    tags: [derechos-fundamentales]

  - id: con-art-13
    model: basic-reversed
    front: Artículo 13
    back: Derecho a la igualdad
    notes: 'Fuente: Módulo 4, p. 17 (§1.6)'
    tags: [derechos-fundamentales]

  - id: con-art-16
    model: basic-reversed
    front: Artículo 16
    back: Derecho al libre desarrollo de la personalidad
    notes: 'Fuente: Módulo 4, p. 17 (§1.6)'
    tags: [derechos-fundamentales]

  - id: con-art-17
    model: basic-reversed
    front: Artículo 17
    back: Prohibición a la esclavitud
    notes: 'Fuente: Módulo 4, p. 17 (§1.6)'
    tags: [derechos-fundamentales]

  - id: con-art-18
    model: basic-reversed
    front: Artículo 18
    back: Derecho de conciencia
    notes: 'Fuente: Módulo 4, p. 17 (§1.6)'
    tags: [derechos-fundamentales]

  - id: con-art-19
    model: basic-reversed
    front: Artículo 19
    back: Derecho a libertad de cultos
    notes: 'Fuente: Módulo 4, p. 17 (§1.6)'
    tags: [derechos-fundamentales]

  - id: con-art-20
    model: basic-reversed
    front: Artículo 20
    back: Derecho a la libertad de opinión
    notes: 'Fuente: Módulo 4, p. 17 (§1.6)'
    tags: [derechos-fundamentales]

  - id: con-art-21
    model: basic-reversed
    front: Artículo 21
    back: Derecho a la honra
    notes: 'Fuente: Módulo 4, p. 17 (§1.6)'
    tags: [derechos-fundamentales]

  - id: con-art-22
    model: basic-reversed
    front: Artículo 22
    back: Derecho a la paz
    notes: 'Fuente: Módulo 4, p. 17 (§1.6)'
    tags: [derechos-fundamentales]

  - id: con-art-24
    model: basic-reversed
    front: Artículo 24
    back: Derecho a la libre locomoción
    notes: 'Fuente: Módulo 4, p. 17 (§1.6)'
    tags: [derechos-fundamentales]

  - id: con-art-53
    model: basic-reversed
    front: Artículo 53
    back: Derecho al trabajo
    notes: 'Fuente: Módulo 4, p. 17 (§1.6)'
    tags: [derechos-fundamentales]

  - id: con-art-38-39
    model: basic-reversed
    front: Artículos 38 y 39
    back: Derecho de asociación
    notes: 'Fuente: Módulo 4, p. 17 (§1.6)'
    tags: [derechos-fundamentales]

  - id: con-art-libertad
    front: ¿Qué artículos consagran el derecho a la libertad según la cartilla?
    back: Los artículos 16, 18 y 19.
    notes: 'Fuente: Módulo 4, p. 17 (§1.6)'
    tags: [derechos-fundamentales]

  - id: con-art-96
    model: basic-reversed
    front: Artículo 96
    back: Derecho fundamental a tener una nacionalidad
    notes: 'Anotación manuscrita del margen (p. 17). Fuente: Módulo 4, p. 17'
    tags: [derechos-fundamentales, anotacion]

  # ─── Cap. II Mecanismos de protección ────────────────────────────────
  - id: con-mecanismos-proteccion-cuando
    front: ¿Cuándo aplican los mecanismos de protección de los derechos?
    back: A todo ciudadano cuando sus derechos han sido vulnerados por el Estado u otra persona.
    notes: 'La anotación manuscrita los sitúa entre los artículos 83 y 94. Fuente: Módulo 4, p. 17 (Cap. 2)'
    tags: [mecanismos-proteccion, anotacion]

  - id: con-tutela-articulo
    model: basic-reversed
    front: Acción de Tutela
    back: Artículo 86
    notes: 'Fuente: Módulo 4, p. 17 (§2.1)'
    tags: [mecanismos-proteccion]

  - id: con-tutela-definicion
    front: ¿En qué consiste la Acción de Tutela?
    back: Toda persona, en forma escrita, puede solicitar ante el juez la protección de sus derechos cuando estos han sido vulnerados.
    notes: 'Fuente: Módulo 4, p. 17 (§2.1)'
    tags: [mecanismos-proteccion]

  - id: con-tutela-plazo
    front: ¿En cuántos días debe resolverse una Acción de Tutela?
    back: En 10 días.
    notes: 'Anotación manuscrita del margen (p. 17, §2.1). Fuente: Módulo 4, p. 17'
    tags: [mecanismos-proteccion, anotacion]

  - id: con-accion-popular-articulo
    model: basic-reversed
    front: Acción Popular
    back: Artículo 88
    notes: 'Fuente: Módulo 4, p. 17 (§2.2)'
    tags: [mecanismos-proteccion]

  - id: con-accion-popular-definicion
    front: ¿En qué consiste la Acción Popular?
    back: Es el mecanismo judicial para la protección de derechos colectivos.
    notes: 'Fuente: Módulo 4, p. 17 (§2.2)'
    tags: [mecanismos-proteccion]

  - id: con-accion-grupo-articulo
    model: basic-reversed
    front: Acción de Grupo
    back: Artículo 90
    notes: 'Fuente: Módulo 4, p. 17 (§2.3)'
    tags: [mecanismos-proteccion]

  - id: con-accion-grupo-definicion
    front: ¿Cuál es la finalidad de la Acción de Grupo?
    back: La reparación de los daños producidos a un grupo de personas por acción u omisión de autoridad pública o particular.
    notes: 'Fuente: Módulo 4, p. 17 (§2.3)'
    tags: [mecanismos-proteccion]

  - id: con-accion-cumplimiento-articulo
    model: basic-reversed
    front: Acción de Cumplimiento
    back: Artículo 87
    notes: 'Fuente: Módulo 4, p. 17 (§2.4)'
    tags: [mecanismos-proteccion]

  - id: con-accion-cumplimiento-definicion
    front: ¿En qué consiste la Acción de Cumplimiento?
    back: Cualquier persona puede acudir a la autoridad para hacer efectivo el cumplimiento de una ley o acto administrativo.
    notes: 'Fuente: Módulo 4, p. 17 (§2.4)'
    tags: [mecanismos-proteccion]

  - id: con-habeas-corpus-articulo
    model: basic-reversed
    front: Habeas Corpus
    back: Artículo 30
    notes: 'Fuente: Módulo 4, p. 18 (§2.5)'
    tags: [mecanismos-proteccion]

  - id: con-habeas-corpus-definicion
    front: ¿En qué consiste el Habeas Corpus?
    back: Cuando alguien es privado de la libertad creyendo estar ilegalmente, puede invocar este derecho.
    notes: 'Fuente: Módulo 4, p. 18 (§2.5)'
    tags: [mecanismos-proteccion]

  - id: con-habeas-corpus-plazo
    front: ¿En qué término debe resolverse el Habeas Corpus?
    back: En el término de 36 horas.
    notes: 'Fuente: Módulo 4, p. 18 (§2.5)'
    tags: [mecanismos-proteccion]

  - id: con-derecho-peticion-articulo
    model: basic-reversed
    front: Derecho de Petición
    back: Artículo 23
    notes: 'Fuente: Módulo 4, p. 18 (§2.6)'
    tags: [mecanismos-proteccion]

  - id: con-derecho-peticion-definicion
    front: ¿En qué consiste el Derecho de Petición?
    back: Toda persona tiene derecho a presentar peticiones respetuosas a las autoridades, para obtener pronta resolución.
    notes: 'Fuente: Módulo 4, p. 18 (§2.6)'
    tags: [mecanismos-proteccion]

  # ─── Cap. III Mecanismos de participación ciudadana ──────────────────
  - id: con-participacion-articulo
    front: ¿Con qué artículo se relacionan los mecanismos de participación ciudadana?
    back: Con el artículo 103 de la C.P.C.
    notes: 'La anotación manuscrita amplía el rango a los artículos 103-106. Fuente: Módulo 4, p. 18 (Cap. 3)'
    tags: [participacion, anotacion]

  - id: con-participacion-ambitos
    model: cloze
    text: 'Los mecanismos de participación permiten a los ciudadanos participar y decidir cambios en lo {{c1::judicial}}, lo {{c1::político}}, lo {{c1::legislativo}} y lo {{c1::ejecutivo}}.'
    notes: 'Fuente: Módulo 4, p. 18 (Cap. 3)'
    tags: [participacion]

  - id: con-voto
    model: basic-reversed
    front: El voto
    back: Derecho de todo ciudadano para participar en democracia, a fin de elegir y ser elegido
    notes: 'Fuente: Módulo 4, p. 18 (§3.1)'
    tags: [participacion]

  - id: con-plebiscito
    model: basic-reversed
    front: El plebiscito
    back: Pronunciamiento del pueblo, convocado por el presidente de la República, para apoyar o rechazar una determinación o propuesta del poder ejecutivo
    notes: 'Fuente: Módulo 4, p. 18 (§3.2)'
    tags: [participacion]

  - id: con-consulta-popular
    model: basic-reversed
    front: La consulta popular
    back: Pronunciamiento de la ciudadanía sobre una decisión; una vez aprobada es de obligatorio cumplimiento para el poder ejecutivo
    notes: 'Fuente: Módulo 4, p. 18 (§3.3)'
    tags: [participacion]

  - id: con-cabildo-abierto
    model: basic-reversed
    front: El cabildo abierto
    back: Reunión de carácter público para tomar decisiones que afectan los intereses de una comunidad
    notes: 'Fuente: Módulo 4, p. 18 (§3.4)'
    tags: [participacion]

  - id: con-revocatoria-mandato
    model: basic-reversed
    front: La revocatoria del mandato
    back: Cuando los ciudadanos expresan su voluntad para dar por terminado el mandato de un gobernador o alcalde elegido popularmente
    notes: 'Fuente: Módulo 4, p. 18 (§3.5)'
    tags: [participacion]

  - id: con-referendo
    model: basic-reversed
    front: El referendo
    back: Cuando se convoca al pueblo para aprobar o rechazar un proyecto o norma jurídica vigente
    notes: 'Puede ser de origen ciudadano o de autoridad pública, y puede ser nacional, regional o local. Fuente: Módulo 4, p. 18 (§3.6)'
    tags: [participacion]

  - id: con-referendo-alcance
    front: ¿De qué origen y de qué alcance puede ser el referendo?
    back: De origen ciudadano o de autoridad pública; puede ser nacional, regional o local.
    notes: 'Fuente: Módulo 4, p. 18 (§3.6)'
    tags: [participacion]

  - id: con-iniciativa-legislativa
    model: basic-reversed
    front: La iniciativa legislativa
    back: Cuando los ciudadanos tienen derecho a presentar un proyecto normativo ante corporación pública
    notes: 'Fuente: Módulo 4, p. 18 (§3.7)'
    tags: [participacion]

  - id: con-participacion-siete
    model: cloze
    text: 'Los mecanismos de participación ciudadana son: el {{c1::voto}}, el {{c1::plebiscito}}, la {{c1::consulta popular}}, el {{c1::cabildo abierto}}, la {{c1::revocatoria del mandato}}, el {{c1::referendo}} y la {{c1::iniciativa legislativa}}.'
    notes: 'Fuente: Módulo 4, p. 18 (Cap. 3)'
    tags: [participacion]

  # ─── Cap. IV Estructura del Estado ───────────────────────────────────
  - id: con-forma-estado
    front: ¿Cómo está organizado el Estado colombiano?
    back: En forma de república unitaria.
    notes: 'La anotación manuscrita remite al artículo 113. Fuente: Módulo 4, p. 18 (Cap. 4)'
    tags: [estructura-estado, anotacion]

  - id: con-estructura-completa
    model: cloze
    text: 'El Estado colombiano está formado por 3 ramas del poder público -{{c1::legislativo}}, {{c1::ejecutivo}} y {{c1::judicial}}-, otros {{c1::órganos autónomos e independientes}}, los {{c1::organismos de control}} y la {{c1::organización electoral}}.'
    notes: 'El resumen escaneado omitía los órganos autónomos e independientes; la guía oficial los incluye en la estructura del Estado. Corregido. Fuente: Guía oficial "Colombia, nuestra casa" (Cancillería), p. 151'
    tags: [estructura-estado, corregido]

  - id: con-rama-ejecutiva
    front: ¿Cuál es la función de la rama ejecutiva y quién la encabeza?
    back: Coordinar todas las actividades administrativas del Estado; en cabeza del Presidente de la República.
    notes: 'Fuente: Módulo 4, p. 18 (§4.1)'
    tags: [ramas]

  - id: con-rama-legislativa
    front: ¿Cuáles son las funciones de la rama legislativa?
    back: Hacer las leyes, ejercer el control político sobre el gobierno y reformar la Constitución.
    notes: 'Fuente: Módulo 4, p. 18 (§4.2)'
    tags: [ramas]

  - id: con-congreso-composicion
    front: ¿Por quiénes está conformada la rama legislativa?
    back: Por el Senado y la Cámara de Representantes.
    notes: 'Fuente: Módulo 4, p. 18 (§4.2)'
    tags: [ramas]

  - id: con-bicameral
    front: ¿Qué sistema tiene Colombia y cómo se compone?
    back: "El sistema bicameral: Cámara Alta (el Senado) y Cámara Baja (la Cámara de Representantes)."
    notes: 'Fuente: Módulo 4, p. 18 (§4.2)'
    tags: [ramas]

  - id: con-congreso-republica
    front: ¿Cómo se llama el conjunto del Senado y la Cámara de Representantes?
    back: El Congreso de la República.
    notes: 'Fuente: Módulo 4, p. 18 (§4.2)'
    tags: [ramas]

  - id: con-rama-judicial
    front: ¿Cuál es la función de la rama judicial y por quiénes está conformada?
    back: Administrar justicia; la conforman la Corte Suprema de Justicia, los Tribunales Judiciales y los juzgados civiles, penales y laborales.
    notes: 'Fuente: Módulo 4, p. 18 (§4.3)'
    tags: [ramas]

  - id: con-jurisdiccion-contenciosa
    model: cloze
    text: 'La Jurisdicción Contencioso Administrativa está conformada por el {{c1::Consejo de Estado}}, los {{c1::Tribunales Administrativos}} y los {{c1::Juzgados Administrativos}}.'
    notes: 'Fuente: Módulo 4, pp. 18-19 (§4.4)'
    tags: [ramas]

  - id: con-jurisdiccion-constitucional
    front: ¿Por quién está conformada la Jurisdicción Constitucional?
    back: Por la Corte Constitucional.
    notes: 'Fuente: Módulo 4, p. 19 (§4.5)'
    tags: [ramas]

  - id: con-jurisdiccion-paz
    front: ¿Por quiénes está conformada la Jurisdicción de Paz?
    back: Por los jueces de paz.
    notes: 'Fuente: Módulo 4, p. 19 (§4.6)'
    tags: [ramas]

  - id: con-fiscalia
    model: basic-reversed
    front: Fiscalía General de la Nación
    back: Acusa ante los jueces e investiga
    notes: 'La función viene de la anotación manuscrita (p. 19, §4.7). Fuente: Módulo 4, p. 19'
    tags: [ramas, anotacion]

  - id: con-consejo-judicatura
    model: basic-reversed
    front: Consejo Superior de la Judicatura
    back: Nombra jueces
    notes: 'La función viene de la anotación manuscrita (p. 19, §4.8). Fuente: Módulo 4, p. 19'
    tags: [ramas, anotacion]

  # ─── 5. Organismos de control ────────────────────────────────────────
  - id: con-organismos-control-funcion
    front: ¿Qué ejercen los organismos de control?
    back: El control disciplinario y fiscal.
    notes: 'Fuente: Módulo 4, p. 19 (§5)'
    tags: [organismos-control]

  - id: con-contraloria
    model: basic-reversed
    front: Contraloría General de la República
    back: Ejerce el control fiscal (dineros) del Estado, el buen uso y ejecución de los dineros públicos
    notes: 'Fuente: Módulo 4, p. 19 (§5)'
    tags: [organismos-control]

  - id: con-procuraduria
    model: basic-reversed
    front: Procuraduría General de la Nación
    back: Realiza las investigaciones disciplinarias a los servidores públicos y particulares con funciones públicas
    notes: 'Fuente: Módulo 4, p. 19 (§5)'
    tags: [organismos-control]

  # ─── 6. Organización electoral ───────────────────────────────────────
  - id: con-organizacion-electoral
    model: cloze
    text: 'La organización electoral está conformada por el {{c1::Consejo Nacional Electoral}} (CNE) y la {{c1::Registraduría Nacional del Estado Civil}}.'
    notes: 'Fuente: Módulo 4, p. 19 (§6)'
    tags: [organizacion-electoral]

  - id: con-cne
    model: basic-reversed
    front: CNE
    back: Consejo Nacional Electoral
    notes: 'La sigla viene de la anotación manuscrita (p. 19). Fuente: Módulo 4, p. 19'
    tags: [organizacion-electoral, anotacion]

  # ─── 7. Organismos autónomos independientes ──────────────────────────
  - id: con-organismos-autonomos
    model: cloze
    text: 'Los organismos autónomos independientes son el {{c1::Banco de la República}}, los {{c1::entes universitarios autónomos}}, las {{c1::Corporaciones Autónomas Regionales}}, la {{c1::Comisión Nacional del Servicio Civil}} y la {{c1::Autoridad Nacional de Televisión}}.'
    notes: 'El resumen escaneado enumeraba cuatro; la guía oficial añade la Autoridad Nacional de Televisión. Corregido. Fuente: Guía oficial "Colombia, nuestra casa" (Cancillería), p. 155'
    tags: [organismos-autonomos, corregido]

  # ─── Defensoría del Pueblo (anotación manuscrita, p. 19) ─────────────
  - id: con-defensoria-ley
    front: ¿Por qué ley fue creada la Defensoría del Pueblo y en aplicación de qué artículo?
    back: Por la Ley 24 de 1992, en aplicación del artículo 283 de la C.P.C.
    notes: 'Anotación manuscrita (p. 19). Fuente: Módulo 4, p. 19'
    tags: [defensoria, anotacion]

  - id: con-defensoria-naturaleza
    front: ¿Qué tipo de organismo es la Defensoría del Pueblo?
    back: Un organismo autónomo vinculado al Ministerio Público; actúa bajo la dirección del Procurador General.
    notes: 'Anotación manuscrita (p. 19). Fuente: Módulo 4, p. 19'
    tags: [defensoria, anotacion]

  - id: con-ministerio-publico
    model: cloze
    text: 'El Ministerio Público lo componen la {{c1::Procuraduría}}, la {{c1::Defensoría}} y las {{c1::Personerías}}.'
    notes: 'Anotación manuscrita del margen (p. 19). Fuente: Módulo 4, p. 19'
    tags: [defensoria, anotacion]

  - id: con-defensoria-enfoque
    front: ¿En qué se enfoca la Defensoría del Pueblo?
    back: En la protección de los derechos humanos en el país.
    notes: 'Anotación manuscrita (p. 19). Fuente: Módulo 4, p. 19'
    tags: [defensoria, anotacion]

  - id: con-defensoria-autonomia
    front: ¿Qué autonomía tiene la Defensoría del Pueblo?
    back: Autonomía administrativa y presupuestal.
    notes: 'Anotación manuscrita (p. 19). Fuente: Módulo 4, p. 19'
    tags: [defensoria, anotacion]

  - id: con-defensoria-garantia
    front: ¿Qué garantiza la Defensoría del Pueblo como entidad?
    back: El "estado social de derecho".
    notes: 'Anotación manuscrita (p. 19). Fuente: Módulo 4, p. 19'
    tags: [defensoria, anotacion]

  - id: con-defensor-eleccion
    front: ¿Quién elige al Defensor del Pueblo, de qué terna y por cuánto tiempo?
    back: Lo elige la Cámara de Representantes, de terna presentada por el Presidente de la República, por 4 años.
    notes: 'Anotación manuscrita (p. 19). Fuente: Módulo 4, p. 19'
    tags: [defensoria, anotacion]

  # ═══════════════════════════════════════════════════════════════════
  # AMPLIACIÓN desde la guía oficial "Colombia, nuestra casa" (pp. 139-155).
  # Este módulo exige 12/20 (60 %), el listón más alto del examen, y era el
  # más comprimido del resumen. Etiqueta `ampliacion`: suspéndela entera en
  # Anki si resulta demasiado.
  # ═══════════════════════════════════════════════════════════════════

  - id: con-esd-tres-obligaciones
    model: cloze
    text: 'En el Estado social de derecho, el Estado {{c1::respeta}} los derechos absteniéndose de interferir, los {{c2::protege}} evitando intromisiones de terceros y los {{c3::garantiza}} mediante autoridades e instituciones.'
    notes: 'Fuente: Guía oficial, p. 139 (§1.1)'
    tags: [principios, ampliacion]

  - id: con-descentralizacion-tres-tipos
    model: cloze
    text: 'La descentralización puede ser {{c1::territorial}}, por {{c1::servicios}} o por {{c1::colaboración}}.'
    notes: 'Fuente: Guía oficial, p. 139 (§1.2)'
    tags: [principios, ampliacion]

  - id: con-descentralizacion-territorial
    model: basic-reversed
    front: Descentralización territorial
    back: Otorga competencias administrativas a las entidades territoriales (departamentos y municipios), que las ejecutan en su propio nombre y bajo su responsabilidad
    notes: 'Fuente: Guía oficial, p. 139 (§1.2)'
    tags: [principios, ampliacion]

  - id: con-descentralizacion-servicios
    model: basic-reversed
    front: Descentralización por servicios
    back: Asigna funciones a entidades creadas para una actividad especializada - establecimientos públicos, corporaciones autónomas regionales, empresas industriales y comerciales del Estado, sociedades de economía mixta
    notes: 'Fuente: Guía oficial, p. 139 (§1.2)'
    tags: [principios, ampliacion]

  - id: con-descentralizacion-colaboracion
    model: basic-reversed
    front: Descentralización por colaboración
    back: Personas privadas ejercen funciones administrativas; por ejemplo las Cámaras de Comercio y la Federación Nacional de Cafeteros
    notes: 'Fuente: Guía oficial, p. 139 (§1.2)'
    tags: [principios, ampliacion]

  - id: con-pena-de-muerte
    front: ¿Está permitida la pena de muerte en Colombia?
    back: No. El derecho a la vida es inviolable y la pena de muerte no es permitida en el territorio nacional.
    notes: 'Fuente: Guía oficial, p. 140 (§1.5.1)'
    tags: [derechos-fundamentales, ampliacion]

  - id: con-igualdad-tres-dimensiones
    model: cloze
    text: 'El derecho a la igualdad tiene tres dimensiones: {{c1::formal}} (la ley se aplica con equidad a todos), {{c2::material}} (paridad de oportunidades) y la prohibición de {{c3::discriminación}}.'
    notes: 'Fuente: Guía oficial, p. 140 (§1.5.2)'
    tags: [derechos-fundamentales, ampliacion]

  - id: con-libre-desarrollo-definicion
    front: ¿Qué protege el derecho al libre desarrollo de la personalidad?
    back: La capacidad de las personas para definir de forma autónoma las opciones vitales que guiarán el curso de su existencia.
    notes: 'Fuente: Guía oficial, p. 141 (§1.5.3)'
    tags: [derechos-fundamentales, ampliacion]

  - id: con-libertad-conciencia-tres
    model: cloze
    text: 'La libertad de conciencia garantiza que nadie sea {{c1::acosado ni perseguido}} por sus convicciones, que nadie esté obligado a {{c2::revelarlas}} y que nadie sea obligado a {{c3::actuar contra su conciencia}}.'
    notes: 'Fuente: Guía oficial, p. 141 (§1.5.4)'
    tags: [derechos-fundamentales, ampliacion]

  - id: con-libertad-opinion-doble-via
    front: ¿Por qué la libertad de opinión es un derecho de doble vía?
    back: Porque su titular no es solo quien emite la información, sino también quien la recibe.
    notes: 'Fuente: Guía oficial, p. 142 (§1.5.7)'
    tags: [derechos-fundamentales, ampliacion]

  - id: con-derecho-rectificacion
    front: ¿Qué se puede ejercer ante una información errónea o parcial de un medio?
    back: El derecho de rectificación ante el medio respectivo, para que pruebe lo que está informando.
    notes: 'Fuente: Guía oficial, p. 142 (§1.5.7)'
    tags: [derechos-fundamentales, ampliacion]

  - id: con-asociacion-sindical-art39
    model: basic-reversed
    front: Artículo 39
    back: Derecho de asociación sindical - trabajadores y empleadores pueden constituir sindicatos sin intervención estatal
    notes: 'Su reconocimiento jurídico se produce con la inscripción del acta de constitución. Fuente: Guía oficial, p. 143 (§1.5.12)'
    tags: [derechos-fundamentales, ampliacion]

  - id: con-accion-popular-requisitos
    model: cloze
    text: 'Para que proceda la acción popular debe haber: {{c1::una acción u omisión}} de autoridades públicas o particulares, {{c2::un daño o amenaza}} a derechos colectivos y el {{c3::nexo de causalidad}} entre ambos.'
    notes: 'Fuente: Guía oficial, p. 146 (§2.2)'
    tags: [mecanismos-proteccion, ampliacion]

  - id: con-accion-grupo-indemnizacion
    front: ¿Cuál es la característica esencial de la acción de grupo?
    back: La indemnización debe hacerse en proporción al daño causado.
    notes: 'Fuente: Guía oficial, p. 146 (§2.3)'
    tags: [mecanismos-proteccion, ampliacion]

  - id: con-peticion-ley-1755
    front: ¿Qué ley fijó los términos del derecho de petición?
    back: La Ley 1755 de 2015.
    notes: 'Fuente: Guía oficial, p. 147'
    tags: [mecanismos-proteccion, ampliacion]

  - id: con-peticion-plazos
    model: cloze
    text: 'El derecho de petición debe resolverse en {{c1::10}} días hábiles para información o documentos, y en {{c2::30}} días hábiles para consultas.'
    notes: 'Ley 1755 de 2015. Tu anotación al margen registraba los 10 días. Fuente: Guía oficial, p. 147'
    tags: [mecanismos-proteccion, ampliacion]

  - id: con-peticion-gratuito
    front: ¿Cómo se puede presentar un derecho de petición?
    back: De manera verbal o escrita, es gratuito y no necesita abogado.
    notes: 'Fuente: Guía oficial, p. 147'
    tags: [mecanismos-proteccion, ampliacion]

  - id: con-voto-caracteristicas
    model: cloze
    text: 'El sufragio en Colombia es {{c1::universal}}, {{c1::libre}}, {{c1::igual}}, {{c1::directo}} y {{c1::secreto}}.'
    notes: 'El voto es a la vez un derecho y un deber ciudadano. Fuente: Guía oficial, p. 149 (§3.1)'
    tags: [participacion, ampliacion]

  - id: con-plebiscito-requisitos
    front: ¿Qué requisitos debe cumplir el presidente para convocar un plebiscito?
    back: La firma de todos los ministros y el concepto favorable previo del Congreso de la República.
    notes: 'Fuente: Guía oficial, p. 149 (§3.2)'
    tags: [participacion, ampliacion]

  - id: con-plebiscito-prohibiciones
    model: cloze
    text: 'El plebiscito no puede emplearse para asuntos de {{c1::tratados internacionales}}, {{c1::leyes de presupuesto}} ni materias {{c1::fiscales y tributarias}}.'
    notes: 'Fuente: Guía oficial, p. 149 (§3.2)'
    tags: [participacion, ampliacion]

  - id: con-consulta-popular-forma
    front: ¿Cómo debe estar redactada una consulta popular?
    back: De forma clara, de manera que los consultados puedan contestar con un Sí o un No.
    notes: 'Una vez tomada la decisión por el pueblo, es de obligatorio cumplimiento para la administración. Fuente: Guía oficial, p. 149 (§3.3)'
    tags: [participacion, ampliacion]

  - id: con-revocatoria-firmas
    front: ¿Qué porcentaje de firmas exige la revocatoria del mandato y ante quién se interpone?
    back: Firmas superiores o iguales al 40 % de los votos que obtuvo el elegido; se interpone ante la registraduría respectiva.
    notes: 'Fuente: Guía oficial, p. 150 (§3.5)'
    tags: [participacion, ampliacion]

  - id: con-iniciativa-corporaciones
    model: cloze
    text: 'La iniciativa legislativa se presenta ante el {{c1::Congreso de la República}}, las {{c1::Asambleas Departamentales}}, los {{c1::Concejos Municipales o Distritales}} o las {{c1::Juntas Administradoras Locales}}.'
    notes: 'Fuente: Guía oficial, p. 150 (§3.7)'
    tags: [participacion, ampliacion]

  - id: con-presidente-tres-calidades
    model: cloze
    text: 'El presidente de la República simboliza la unidad nacional y actúa como jefe de {{c1::Estado}}, jefe de {{c1::Gobierno}} y suprema autoridad {{c1::administrativa}}.'
    notes: 'Fuente: Guía oficial, p. 154'
    tags: [ramas, ampliacion]

  - id: con-gobierno-nacional-composicion
    front: ¿Por quiénes está conformado el Gobierno Nacional?
    back: Por el Presidente de la República, los ministros del despacho y los directores de departamentos administrativos.
    notes: 'Fuente: Guía oficial, p. 154'
    tags: [ramas, ampliacion]

  - id: con-ejecutiva-tres-niveles
    model: cloze
    text: 'La Rama Ejecutiva se organiza en tres niveles: {{c1::nacional}}, {{c1::departamental}} y {{c1::municipal}}.'
    notes: 'Fuente: Guía oficial, p. 154'
    tags: [ramas, ampliacion]

  - id: con-altas-cortes
    model: cloze
    text: 'Los órganos superiores de la Rama Judicial son la {{c1::Corte Constitucional}}, la {{c1::Corte Suprema de Justicia}}, el {{c1::Consejo de Estado}}, el {{c1::Consejo Superior de la Judicatura}} y la {{c1::Fiscalía General de la Nación}}.'
    notes: 'Fuente: Guía oficial, p. 154'
    tags: [ramas, ampliacion]

  - id: con-jurisdiccion-ordinaria
    model: cloze
    text: 'La jurisdicción ordinaria la componen la {{c1::Corte Suprema de Justicia}}, los {{c1::Tribunales Superiores de Distrito Judicial}} y los {{c1::juzgados}}.'
    notes: 'Fuente: Guía oficial, p. 152'
    tags: [ramas, ampliacion]

  - id: con-rama-judicial-funcion-oficial
    front: Según la guía oficial, ¿qué le corresponde a la Rama Judicial?
    back: Administrar justicia, solucionar los conflictos entre los ciudadanos y entre estos y el Estado, y decidir cuestiones jurídicas mediante sentencias, fallos o autos.
    notes: 'Fuente: Guía oficial, p. 152'
    tags: [ramas, ampliacion]

  - id: con-camara-elige-defensor
    front: ¿Quién elige al Defensor del Pueblo?
    back: La Cámara de Representantes.
    notes: 'Confirma tu anotación manuscrita de la p. 19. Fuente: Guía oficial, p. 151'
    tags: [ramas, defensoria, ampliacion]

  - id: con-camara-cuenta-general
    front: ¿Qué hace la Cámara de Representantes con la cuenta general del presupuesto?
    back: La examina y la fenece; se la presenta el Contralor General de la República.
    notes: 'Fuente: Guía oficial, p. 151'
    tags: [ramas, ampliacion]

  - id: con-senado-funciones
    front: ¿Qué funciones cumple el Senado de la República?
    back: Tramitar proyectos de ley y actos legislativos, hacer debates de control político y público, y elegir altos dignatarios del Estado.
    notes: 'Fuente: Guía oficial, p. 151'
    tags: [ramas, ampliacion]

  - id: con-ministerio-publico-oficial
    model: cloze
    text: 'El Ministerio Público lo integran la {{c1::Procuraduría General de la Nación}}, la {{c1::Defensoría del Pueblo}} y los {{c1::agentes del Ministerio Público}}.'
    notes: 'Fuente: Guía oficial, p. 155'
    tags: [organismos-control, defensoria, ampliacion]

  - id: con-contraloria-maximo-organo
    front: ¿Cuál es el máximo órgano de control fiscal del Estado colombiano?
    back: La Contraloría General de la República; vigila el buen uso de los recursos y bienes públicos.
    notes: 'Fuente: Guía oficial, pp. 152 y 155'
    tags: [organismos-control, ampliacion]

  - id: con-registraduria-funciones
    front: ¿De qué se encarga la Registraduría Nacional del Estado Civil?
    back: De la organización, dirección y vigilancia de las elecciones, y de la identificación de las personas.
    notes: 'Fuente: Guía oficial, p. 155'
    tags: [organizacion-electoral, ampliacion]

  - id: con-banco-republica-funciones
    model: cloze
    text: 'Funciones del Banco de la República: regular la {{c1::moneda, los cambios internacionales y el crédito}}, {{c1::emitir la moneda legal}}, administrar las {{c1::reservas internacionales}}, ser {{c1::prestamista de última instancia}} y servir como {{c1::agente fiscal del gobierno}}.'
    notes: 'Fuente: Guía oficial, p. 153 (§4.4.4)'
    tags: [organismos-autonomos, ampliacion]

  - id: con-car-funcion
    front: ¿Qué administran las Corporaciones Autónomas Regionales?
    back: El medio ambiente y los recursos naturales renovables dentro de su jurisdicción, propendiendo por su desarrollo sostenible.
    notes: 'Fuente: Guía oficial, p. 153 (§4.4.4)'
    tags: [organismos-autonomos, ampliacion]

  - id: con-entes-universitarios
    front: ¿Qué son los entes universitarios autónomos y a qué ministerio se vinculan?
    back: Las universidades estatales u oficiales, vinculadas al Ministerio de Educación Nacional; tienen personería jurídica, autonomía académica, administrativa y financiera, y patrimonio independiente.
    notes: 'Fuente: Guía oficial, p. 153 (§4.4.4)'
    tags: [organismos-autonomos, ampliacion]

  - id: con-organos-autonomos-definicion
    front: ¿Qué caracteriza a los órganos autónomos e independientes?
    back: Tienen un régimen especial y autonomía propia prevista directamente por la Constitución o la ley, dada la especialidad de sus funciones.
    notes: 'Fuente: Guía oficial, p. 153 (§4.4.4)'
    tags: [organismos-autonomos, ampliacion]

  - id: con-autoridad-nacional-television
    front: Además del Banco de la República y las CAR, ¿qué otros órganos autónomos lista la guía oficial?
    back: La Comisión Nacional del Servicio Civil, los entes universitarios autónomos y la Autoridad Nacional de Televisión.
    notes: 'Fuente: Guía oficial, p. 155'
    tags: [organismos-autonomos, ampliacion]

  - id: con-organizacion-territorial
    front: ¿Qué es la organización territorial?
    back: El conjunto de normas que regulan cómo se distribuye espacialmente el poder público entre los niveles nacional, departamental, distrital y municipal.
    notes: 'Fuente: Guía oficial, p. 154'
    tags: [estructura-estado, ampliacion]
