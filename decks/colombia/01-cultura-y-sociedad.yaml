# Etiquetas de control:
#   anotacion             — el dato viene de una nota manuscrita del margen
#   externo               — no está en la guía oficial; la nota lleva la fuente
#   corregido             — el resumen escrito a mano se apartaba de la guía
#                           oficial "Colombia, nuestra casa"; la tarjeta sigue a
#                           la guía oficial, que es sobre la que se arma el examen
#   error-fuente-oficial  — el error está en la guía OFICIAL; la tarjeta la sigue
#                           igual (es lo que evalúan) y la nota explica el hecho real

