  # ─── Cap. II 2.1-2.2 Gastronomía ─────────────────────────────────────
  - id: cul-gastronomia-ingredientes
    model: cloze
    text: 'Los principales ingredientes de la gastronomía colombiana son el {{c1::maíz}}, la {{c1::yuca}}, los {{c1::frijoles}}, los {{c1::tamales}} y las {{c1::frutas tropicales}}.'
    notes: 'Fuente: Módulo 1, p. 2 (§2.1)'
    tags: [gastronomia]

  - id: cul-gastronomia-caribe
    front: ¿En qué se basa la gastronomía de la región Caribe?
    back: "En frutos del mar y pescados: bacalao, pargo rojo, bocachico, camarones, langostinos, chipichipi y arroz con coco."
    notes: 'Fuente: Módulo 1, p. 2 (§2.2 A)'
    tags: [gastronomia]

  - id: cul-gastronomia-insular-ubicacion
    front: ¿Dónde se ubica la región insular?
    back: En el archipiélago de San Andrés y Providencia, en el mar Caribe.
    notes: 'Fuente: Módulo 1, p. 2 (§2.2 B)'
    tags: [gastronomia]

  - id: cul-rondon
    model: basic-reversed
    front: El Rondón
    back: Plato típico insular (filete de pescado) con pescado, cangrejo, colita de cerdo, plátano verde y yuca; se sirve como cazuela de mariscos
    notes: 'Fuente: Módulo 1, p. 3 (§2.2 B)'
    tags: [gastronomia]

  - id: cul-gastronomia-pacifico-deptos
    front: ¿En qué departamentos se ubica la gastronomía de la región Pacífica?
    back: En el Valle del Cauca y el Chocó.
    notes: 'Fuente: Módulo 1, p. 3 (§2.2 C)'
    tags: [gastronomia]

  - id: cul-gastronomia-pacifico-ingredientes
    front: ¿Qué incluye la gastronomía de la región Pacífica?
    back: Productos de mar y río, frutos silvestres y hierbas como la albahaca y la menta.
    notes: 'Fuente: Módulo 1, p. 3 (§2.2 C)'
    tags: [gastronomia]

  - id: cul-gastronomia-pacifico-platos
    front: ¿Cuáles son los principales platos de la región Pacífica?
    back: El sancocho de gallina y la chuleta de cerdo.
    notes: 'Fuente: Módulo 1, p. 3 (§2.2 C)'
    tags: [gastronomia]

  - id: cul-gastronomia-andina-ingredientes
    model: cloze
    text: 'Los ingredientes principales de la región Andina son la {{c1::papa}}, las {{c1::legumbres}} y las carnes de {{c1::res}}, {{c1::cerdo}} y {{c1::gallina}}.'
    notes: 'Fuente: Módulo 1, p. 3 (§2.2 D)'
    tags: [gastronomia]

  - id: cul-region-andina-conforman
