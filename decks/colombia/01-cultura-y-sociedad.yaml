    tags: [cine, anotacion]

  # ─── 2.6 Radio y televisión ──────────────────────────────────────────
  - id: cul-radio-decada
    front: ¿En qué década inició la radio en Colombia?
    back: En la década de 1920.
    notes: 'Fuente: Módulo 1, p. 5 (§2.6)'
    tags: [radio-tv]

  - id: cul-radio-sutatenza
    model: basic-reversed
    front: Radio Sutatenza
    back: La emisora más destacada de Colombia; alfabetizó a mucha población campesina
    notes: 'Fuente: Módulo 1, p. 5 (§2.6)'
    tags: [radio-tv]

  - id: cul-television-llegada
    front: ¿En qué año llegó la televisión a Colombia y bajo qué gobierno?
    back: En 1954, en el gobierno del general Gustavo Rojas Pinilla.
    notes: 'Fuente: Módulo 1, p. 5 (§2.6)'
    tags: [radio-tv]

  # ─── 2.7 Arquitectura (externo: la cartilla remite al material adjunto)
  - id: cul-arquitectura-periodos
    front: ¿Cuáles son los grandes períodos de la arquitectura colombiana?
    back: Precolombina indígena, colonial (religiosa y militar), republicana o neoclásica, de transición y moderna.
    notes: 'La cartilla remite al material adjunto (§2.7). Fuente: https://es.wikipedia.org/wiki/Arquitectura_de_Colombia'
    tags: [arquitectura, externo]

  - id: cul-arquitectura-colonial-militar
    model: basic-reversed
    front: Castillo San Felipe de Barajas y las murallas de Cartagena
    back: Obras sobresalientes de la arquitectura militar colonial; patrimonio de la humanidad
    notes: 'La cartilla remite al material adjunto (§2.7). Fuente: https://es.wikipedia.org/wiki/Arquitectura_de_Colombia'
    tags: [arquitectura, externo]

  - id: cul-arquitectura-republicana
    front: ¿Qué caracteriza a la arquitectura republicana colombiana?
    back: Surge tras la independencia y adapta estilos europeos (neoclásico, neogótico, ecléctico) para expresar la identidad nacional.
    notes: 'La cartilla remite al material adjunto (§2.7). Fuente: https://es.wikipedia.org/wiki/Arquitectura_de_Colombia'
    tags: [arquitectura, externo]

  - id: cul-rogelio-salmona
    model: basic-reversed
    front: Rogelio Salmona
    back: Máximo representante de la arquitectura moderna colombiana (Torres del Parque, Museo Quimbaya, Archivo General de la Nación)
    notes: 'La cartilla remite al material adjunto (§2.7). Fuente: https://enciclopedia.banrepcultural.org/Rogelio_Salmona'
    tags: [arquitectura, externo]

