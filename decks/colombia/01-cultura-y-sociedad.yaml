  # ─── 2.11 Religiones ─────────────────────────────────────────────────
  - id: cul-religion-mayoritaria
    front: ¿Cuál es la religión de la mayor parte de la población colombiana?
    back: La católica.
    notes: 'Fuente: Módulo 1, p. 6 (§2.11)'
    tags: [religion]

  - id: cul-religiones-migrantes
    front: ¿Qué religiones llegaron posteriormente a Colombia con los migrantes?
    back: El hinduismo y el islam.
    notes: 'Fuente: Módulo 1, p. 6 (§2.11)'
    tags: [religion]

  # ─── Cap. III Turismo ────────────────────────────────────────────────
  - id: cul-turismo-cnt
    front: ¿Con qué entidad comienza el turismo en Colombia?
    back: Con la creación de la Corporación Nacional de Turismo (C.N.T.).
    notes: 'Fuente: Módulo 1, p. 6 (§3.1)'
    tags: [turismo]

  - id: cul-turismo-litoral
    front: ¿Qué cubre el turismo litoral y dónde se desarrolla más?
    back: Cubre las regiones costeras del mar Caribe y el océano Pacífico; se desarrolla más por sus climas cálidos en Santa Marta, Cartagena y Barranquilla.
    notes: 'Fuente: Módulo 1, p. 6 (§3.2)'
    tags: [turismo]

  - id: cul-turismo-naturaleza-actividades
    model: cloze
    text: 'En el turismo de naturaleza se realizan actividades de {{c1::senderismo}}, {{c1::avistamiento de aves}}, {{c1::buceo}} y {{c1::avistamiento de ballenas}}.'
    notes: 'Fuente: Módulo 1, p. 6 (§3.3)'
    tags: [turismo]

  - id: cul-turismo-naturaleza-lugares
    model: cloze
    text: 'Lugares turísticos de naturaleza: la {{c1::Sierra Nevada de Santa Marta}}, el Parque Natural de los {{c1::Nevados}}, el Parque {{c1::Tayrona}} y el Nevado del {{c1::Cocuy}} en Boyacá.'
    notes: 'Fuente: Módulo 1, p. 6 (§3.3)'
    tags: [turismo]

  - id: cul-turismo-rural
    front: ¿Qué es el turismo rural?
    back: Es el agroturismo, que interactúa con los espacios naturales del campo.
    notes: 'Fuente: Módulo 1, p. 6 (§3.4)'
    tags: [turismo]

  - id: cul-turismo-academico-cultural
    front: ¿Qué refleja el turismo académico y cultural, y con qué eventos?
    back: "Refleja la diversidad artística y las festividades: el Carnaval de Barranquilla, la Feria de las Flores de Medellín y el Festival Vallenato en Valledupar."
    notes: 'Fuente: Módulo 1, p. 6 (§3.5)'
    tags: [turismo]

  - id: cul-turismo-ciudades-pacifico
    front: ¿Qué ciudades del Pacífico figuran entre los lugares turísticos más visitados?
    back: Tumaco y Buenaventura.
    notes: 'Fuente: Módulo 1, p. 7 (§3.6)'
    tags: [turismo]

  - id: cul-turismo-ciudades-principales
    model: cloze
    text: 'Entre los lugares turísticos más visitados están las ciudades de {{c1::Bogotá}}, {{c1::Medellín}}, {{c1::Cali}} y {{c1::Bucaramanga}}.'
    notes: 'Fuente: Módulo 1, p. 7 (§3.6)'
    tags: [turismo]

  - id: cul-eje-cafetero-turismo
    front: ¿Por qué es famoso el eje cafetero como destino turístico?
    back: Por sus plantaciones de café.
    notes: 'Fuente: Módulo 1, p. 7 (§3.6)'
    tags: [turismo]

  - id: cul-amazonia-turismo
    front: ¿Qué destaca de la región de la Amazonia como destino turístico?
    back: Su selva tropical y su población indígena.
    notes: 'Fuente: Módulo 1, p. 7 (§3.6)'
    tags: [turismo]
