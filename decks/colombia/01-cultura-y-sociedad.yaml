  # ─── 2.5 Cine ────────────────────────────────────────────────────────
  - id: cul-cine-epoca-oro
    front: ¿A partir de qué año comienza la época de oro del cine colombiano?
    back: A partir de 1950, cuando se produjeron las primeras películas que mostraban la realidad social y cultural.
    notes: 'Fuente: Módulo 1, p. 5 (§2.5)'
    tags: [cine]

  - id: cul-sergio-cabrera
