cards:

  # ─── 1.1 Nombre de Colombia ──────────────────────────────────────────
  - id: cul-nombre-homenaje
    front: ¿A quién es un homenaje el nombre de Colombia?
    back: Al navegante Cristóbal Colón, descubridor del continente americano.
    notes: 'Fuente: Módulo 1, p. 1 (§1.1)'
    tags: [simbolos-patrios]

  - id: cul-nombre-quien
    front: ¿Quién dio el nombre de Colombia y en qué congreso?
    back: Simón Bolívar, en el Congreso de Angostura.
    notes: 'Fuente: Módulo 1, p. 1 (§1.1)'
    tags: [simbolos-patrios]

  - id: cul-nombre-fecha
    front: ¿En qué fecha exacta se dio el nombre de Colombia?
    back: El 15 de febrero de 1819.
    notes: 'Fuente: Módulo 1, p. 1 (§1.1)'
    tags: [simbolos-patrios]

  - id: cul-gran-colombia-integrantes
    model: cloze
    text: 'La Gran Colombia estuvo conformada por {{c1::Colombia}}, {{c1::Venezuela}}, {{c1::Ecuador}} y {{c1::Panamá}}.'
    notes: 'Fuente: Módulo 1, p. 1 (§1.1)'
    tags: [simbolos-patrios]

  - id: cul-nombre-1886
    front: ¿En qué año se retomó el nombre de República de Colombia?
    back: En 1886.
    notes: 'Fuente: Módulo 1, p. 1 (§1.1)'
    tags: [simbolos-patrios]

  # ─── 1.2 Bandera ─────────────────────────────────────────────────────
  - id: cul-bandera-franjas
    front: ¿Cómo está conformada la bandera de Colombia?
    back: "Por 3 franjas horizontales: amarillo, azul y rojo."
    notes: 'Fuente: Módulo 1, p. 1 (§1.2)'
    tags: [simbolos-patrios]

  - id: cul-bandera-amarillo
    front: En la bandera de Colombia, ¿qué representa el amarillo?
    back: La riqueza de nuestro suelo.
    notes: 'Fuente: Módulo 1, p. 1 (§1.2)'
    tags: [simbolos-patrios]

  - id: cul-bandera-azul
    front: En la bandera de Colombia, ¿qué representa el azul?
    back: El cielo, sus ríos, océanos y mares.
    notes: 'Fuente: Módulo 1, p. 1 (§1.2)'
    tags: [simbolos-patrios]

  - id: cul-bandera-rojo
    front: En la bandera de Colombia, ¿qué representa el rojo?
    back: La sangre derramada por los libertadores del país.
    notes: 'Fuente: Módulo 1, p. 1 (§1.2)'
    tags: [simbolos-patrios]

  - id: cul-bandera-miranda
    front: ¿Quién propuso los colores de la bandera de Colombia?
    back: El venezolano Francisco Miranda.
    notes: 'Fuente: Módulo 1, p. 1 (§1.2)'
    tags: [simbolos-patrios]

  # ─── 1.3 Escudo ──────────────────────────────────────────────────────
  - id: cul-escudo-anio-autor
    front: ¿En qué año y por quién fue diseñado el escudo nacional?
    back: En 1834, por Francisco de Paula Santander.
    notes: 'Fuente: Módulo 1, p. 1 (§1.3)'
    tags: [simbolos-patrios]

  - id: cul-escudo-representa
    front: ¿Qué representa el escudo nacional?
    back: La identidad y los valores de la nación.
    notes: 'Fuente: Módulo 1, p. 1 (§1.3)'
    tags: [simbolos-patrios]

  - id: cul-escudo-composicion
    front: ¿De qué consta el escudo nacional?
    back: De tres franjas horizontales y 2 banderas nacionales; en la parte central superior, un cóndor.
    notes: 'Fuente: Módulo 1, p. 1 (§1.3)'
    tags: [simbolos-patrios]

  - id: cul-escudo-condor
    front: ¿Qué ave corona el escudo nacional y de qué es emblemática?
    back: El cóndor, ave emblemática de los Andes.
    notes: 'Fuente: Módulo 1, p. 1 (§1.3)'
    tags: [simbolos-patrios]

  # ─── 1.4 Himno ───────────────────────────────────────────────────────
  - id: cul-himno-letra
    front: ¿En qué año y por quién fue escrito el Himno Nacional?
    back: En 1887, por el presidente Rafael Núñez.
    notes: 'Fuente: Módulo 1, p. 1 (§1.4)'
    tags: [simbolos-patrios]

  - id: cul-himno-musica
    front: ¿Quién musicalizó el Himno Nacional?
    back: El italiano Oreste Sindici.
    notes: 'Fuente: Módulo 1, p. 1 (§1.4)'
    tags: [simbolos-patrios]

  - id: cul-himno-proclamacion
    front: ¿En qué año y bajo qué presidente se proclamó el Himno Nacional?
    back: En 1920, bajo el presidente Marco Fidel Suárez.
    notes: 'Fuente: Módulo 1, p. 1 (§1.4)'
    tags: [simbolos-patrios]

  - id: cul-himno-coro
    front: Escriba el coro del Himno Nacional de Colombia.
    back: ¡Oh, gloria inmarcesible!<br>¡Oh, júbilo inmortal!<br>¡En surcos de dolores<br>el bien germina ya!
    notes: 'La cartilla remite a buscarlo (§1.4.1). Texto oficial. Fuente: https://es.wikipedia.org/wiki/Himno_nacional_de_Colombia'
    tags: [simbolos-patrios, externo]

  - id: cul-himno-primera-estrofa
    front: Escriba la primera estrofa del Himno Nacional de Colombia.
    back: ¡Cesó la horrible noche!<br>La libertad sublime<br>derrama las auroras<br>de su invencible luz.<br>La humanidad entera,<br>que entre cadenas gime,<br>comprende las palabras<br>del que murió en la cruz.
    notes: 'La cartilla remite a buscarla (§1.4.1). Texto oficial. Fuente: https://es.wikipedia.org/wiki/Himno_nacional_de_Colombia'
    tags: [simbolos-patrios, externo]

  # ─── 1.5-1.7 Ave, flor, árbol ────────────────────────────────────────
  - id: cul-ave-nacional
    front: ¿Cuál es el ave nacional de Colombia?
    back: El cóndor andino, el ave más grande del mundo.
    notes: 'Fuente: Módulo 1, p. 1 (§1.5)'
    tags: [simbolos-patrios]

  - id: cul-flor-nacional
    front: ¿Cuál es la flor nacional de Colombia?
    back: La Cattleya trianae o flor de mayo; también la llaman la orquídea.
    notes: 'Fuente: Módulo 1, p. 1 (§1.6)'
    tags: [simbolos-patrios]

  - id: cul-arbol-nacional
    front: ¿Cuál es el árbol nacional de Colombia?
    back: La palma de cera del Quindío.
    notes: 'Fuente: Módulo 1, p. 2 (§1.7)'
    tags: [simbolos-patrios]

  - id: cul-palma-altura
    front: ¿Qué altura alcanza la palma de cera del Quindío y dónde se cultiva?
    back: Hasta 70 metros de altura; se cultiva en el eje cafetero de Colombia.
    notes: 'Fuente: Módulo 1, p. 2 (§1.7)'
    tags: [simbolos-patrios]

  # ─── 1.8 Símbolos culturales ─────────────────────────────────────────
  - id: cul-simbolo-cultural
    front: ¿Cuál es el símbolo cultural de Colombia?
    back: El sombrero vueltiao.
    notes: 'Fuente: Módulo 1, p. 2 (§1.8)'
    tags: [simbolos-culturales]

  - id: cul-vueltiao-origen
    front: ¿De qué región y de qué cultura proviene el sombrero vueltiao?
    back: De la región del Caribe colombiano, con raíces en la cultura zenú.
    notes: 'Fuente: Módulo 1, p. 2 (§1.8)'
    tags: [simbolos-culturales]

